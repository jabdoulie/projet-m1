name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  wave:
    # Le workflow réutilisable demande contents: write (commit GitOps deployment.yml sur main)
    permissions:
      contents: write
    # Évite une boucle infinie après le commit GitOps ([skip ci] comme dans le Jenkinsfile)
    if: ${{ !(github.event_name == 'push' && github.event.head_commit != null && contains(github.event.head_commit.message, '[skip ci]')) }}
    uses: ./.github/workflows/reusable-wave-ci.yml
    secrets: inherit
