# ===========================================
# CONFIGMAP : Variables d'environnement Laravel
# MySQL et Redis sont sur le serveur Database (externe au cluster K8s)
# ===========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: wave-env
data:
  # Application Laravel
  APP_NAME: "Wave"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://wave.local"
  FORCE_HTTPS: "true"
  SESSION_SECURE_COOKIE: "false"
  
  # Base de données externe (serveur Database - Docker Compose)
  # IMPORTANT: Remplacer DATABASE_SERVER_IP par l'IP du serveur Database
  DB_CONNECTION: "mysql"
  DB_HOST: "10.123.1.11"   #"DATABASE_SERVER_IP"
  DB_PORT: "3306"
  DB_DATABASE: "wave"
  DB_USERNAME: "wave-user"
  
  # Redis externe (serveur Database - Docker Compose)
  
  REDIS_HOST: "10.123.1.11"   #DATABASE_SERVER_IP"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  
  # Cache & Session (file/sync : pas d'extension phpredis dans l'image PHP)
  CACHE_DRIVER: "file"
  SESSION_DRIVER: "file"
  QUEUE_CONNECTION: "sync"
  
  # Logging
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "info"
