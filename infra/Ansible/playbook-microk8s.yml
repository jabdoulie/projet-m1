---
# ===========================================
# PLAYBOOK : Installation de MicroK8s
# Cible : Serveurs Frontend et Backend du cluster applicatif
# ===========================================
- name: Installer et configurer MicroK8s
  hosts: webservers
  become: true
  # Un seul nœud à la fois : évite la contention CPU/RAM sur t2.micro (timeouts API :16443).
  serial: 1
  tasks:
    - name: Installer snapd
      apt:
        name: snapd
        state: present
        update_cache: yes

    - name: Installer MicroK8s via snap
      snap:
        name: microk8s
        classic: yes
        state: present

    - name: Ajouter l'utilisateur ubuntu au groupe microk8s
      user:
        name: ubuntu
        groups: microk8s
        append: yes

    - name: Créer le dossier .kube
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Attendre que l'API Kubernetes réponde (MicroK8s prêt)
      command: /snap/bin/microk8s kubectl get nodes
      changed_when: false
      retries: 90
      delay: 15
      register: kube_api_wait
      until: kube_api_wait.rc == 0

    # Pas de "storage" (déprécié -> hostpath-storage). Pas de "registry" si Docker Hub + Flux (charge API sur t2.micro).
    - name: Activer addon dns
      command: /snap/bin/microk8s enable dns
      register: addon_dns
      retries: 6
      delay: 45
      until: addon_dns.rc == 0
      changed_when: "'already enabled' not in (addon_dns.stdout | default('') | lower)"

    - name: Pause après dns (stabilisation API)
      pause:
        seconds: 20

    - name: Activer addon hostpath-storage
      command: /snap/bin/microk8s enable hostpath-storage
      register: addon_storage
      retries: 6
      delay: 45
      until: addon_storage.rc == 0
      changed_when: "'already enabled' not in (addon_storage.stdout | default('') | lower)"

    - name: Pause après stockage
      pause:
        seconds: 20

    - name: Activer addon ingress
      command: /snap/bin/microk8s enable ingress
      register: addon_ingress
      retries: 6
      delay: 45
      until: addon_ingress.rc == 0
      changed_when: "'already enabled' not in (addon_ingress.stdout | default('') | lower)"

    - name: Générer le fichier kubeconfig
      shell: /snap/bin/microk8s config > /home/ubuntu/.kube/config
      args:
        creates: /home/ubuntu/.kube/config

    - name: Définir les permissions du kubeconfig
      file:
        path: /home/ubuntu/.kube/config
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Créer un alias kubectl
      lineinfile:
        path: /home/ubuntu/.bashrc
        line: "alias kubectl='/snap/bin/microk8s kubectl'"
        state: present

    - name: Vérifier le statut de MicroK8s
      command: /snap/bin/microk8s status
      register: microk8s_final_status
      changed_when: false

    - name: Afficher le statut de MicroK8s
      debug:
        msg: "{{ microk8s_final_status.stdout_lines }}"
